$kind: http-request
method: GET
url: '{{base_url}}/about'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const data = pm.response.json();
      pm.test('Status 200 i neprazna lista', () => {
        pm.response.to.have.status(200);
        pm.expect(data).to.be.an('array').that.is.not.empty;
      });
      pm.test('Zapisi imaju očekivana polja', () => {
        data.forEach((row) => pm.expect(row).to.include.all.keys('id', 'heading', 'body', 'image', 'sort_order'));
      });

