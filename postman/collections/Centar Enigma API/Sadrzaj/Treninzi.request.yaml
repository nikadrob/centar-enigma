$kind: http-request
method: GET
url: '{{base_url}}/trainings'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const data = pm.response.json();
      pm.test('Status 200 i neprazna lista', () => {
        pm.response.to.have.status(200);
        pm.expect(data).to.be.an('array').that.is.not.empty;
      });
      pm.test('Zapisi imaju očekivana polja', () => {
        data.forEach((row) => pm.expect(row).to.include.all.keys('id', 'name', 'description', 'duration_min', 'level', 'image', 'sort_order'));
      });
      pm.test('Poredano po sort_order', () => {
        const order = data.map((r) => r.sort_order);
        pm.expect(order).to.eql([...order].sort((a, b) => a - b));
      });
