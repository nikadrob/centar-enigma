$kind: collection
name: Centar Enigma API
description: |-
  API fitness studija Centar Enigma (Express + SQLite, mapa server/).
  Pokreni server (`npm run dev:server`) i seed (`npm run seed --prefix server`)
  prije izvođenja. GET odgovori imaju isti oblik kao client/src/data/*.js.
variables:
  - key: base_url
    value: 'http://localhost:3001/api'
    description: Zadana adresa lokalnog servera; okruženje je može nadjačati
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test('Odgovor je JSON', () => {
        pm.response.to.have.header('Content-Type');
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
